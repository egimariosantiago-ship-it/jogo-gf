{a:"Parceria com escritório",c:"Inovação como nova combinação (Schumpeter) e forças de Porter",q:"Um escritório de contabilidade com cerca de 200 clientes PMEs propõe indicar a GF em troca de 20% de comissão e acesso imediato à plataforma. O caixa está curto e o suporte tem pouca folga. Como você estrutura o acordo?",o:[
{t:"Piloto com 10 clientes do escritório, comissão menor no início e metas de conversão e retenção combinadas por escrito.",d:[4,8,4,6],k:1200,r:2,f:"Um piloto com regras claras é a lógica da inovação como nova combinação de recursos (Schumpeter): testa o canal sem comprometer margem e gera dados de conversão e retenção antes de ampliar."},
{t:"Liberar a plataforma aos 200 clientes de uma vez, pagando os 20% pedidos, para ganhar escala e fechar o trimestre forte.",d:[-8,4,-8,-2],k:2500,r:0,f:"A escala rápida parece atraente, mas comissão alta e suporte para 200 clientes de uma vez pressionam margem e atendimento, além de criar dependência de um único canal (poder de barganha, nas forças de Porter)."},
{t:"Oferecer só treinamento ao escritório, sem comissão, e esperar as indicações chegarem naturalmente ao longo do semestre.",d:[0,-2,0,2],k:200,r:1,f:"Protege o caixa, mas sem incentivo nem meta o canal gera pouco volume e quase nenhum dado para decidir. É seguro, porém lento."}]},
{a:"Estratégia de crescimento",c:"Forças de Porter e estratégia competitiva",h:1,q:"O orçamento comercial do ano só comporta uma grande aposta. A GF enfrenta Conta Azul, Omie e Bling, que são consolidadas. Qual aposta recebe o investimento?",o:[

{t:"Criar uma versão white label para escritórios contábeis e vendê-la por indicação, adaptando o produto a cada parceiro.",d:[-2,4,-2,4],k:3000,r:1,f:"É uma oportunidade citada no questionário, mas a personalização por parceiro consome a equipe. O relatório recomenda testar em pequena escala antes."},
{t:"Lançar plano de entrada barato para todas as PMEs, com campanha ampla, para ganhar volume rápido de assinantes.",d:[-8,2,-4,-2],k:2500,r:0,f:"Coloca a GF para competir de frente onde as rivais têm mais marca e escala, e preço baixo sem controle de custos pressiona o caixa."}]},

{t:"Entrevistar clientes que cancelaram e cruzar os motivos com os registros de atendimento, antes de mexer em preço ou produto.",d:[6,10,6,10],k:300,r:2,f:"Decidir com evidência é a lógica do controle gerencial: só se corrige o que se entende. A investigação ainda alimenta o painel e o atendimento padronizado."},
{t:"Oferecer desconto de renovação a quem tentar cancelar, acompanhando todo mês o impacto na receita e na retenção.",d:[-6,6,0,0],k:2000,r:1,f:"Pode segurar clientes no curto prazo e é medido, mas reduz a receita e não revela a causa do problema."},

{a:"Painel para os sócios",c:"Controle gerencial e visão contábil",h:1,q:"Na reunião mensal, os sócios pedem um relatório de resultado. A empresa informa faturamento de R$ 540 mil por mês, mas a planilha de novembro tem 37% dos lançamentos sem data de pagamento e não separa custos de despesas. O que você leva?",o:[
{t:"Receita, custos e despesas classificados, fluxo de caixa projetado e realizado e indicadores de clientes, em uma única página.",d:[10,4,8,4],k:0,r:2,f:"Separa faturamento de resultado e de caixa, e cobre as perspectivas financeira e de clientes do BSC com poucos números, o suficiente para decidir."},
{t:"Um painel completo com 25 indicadores de todas as áreas, atualizado toda semana por três pessoas para não perder nada.",d:[-2,0,-6,2],k:1000,r:1,f:"Tem boa intenção, mas excesso de indicadores consome tempo e dilui o foco. Um painel enxuto tende a ser mais usado nas decisões."},
{t:"Apenas o faturamento do mês e o número de novos clientes, dados que todos já conhecem e entendem rápido.",d:[-6,-4,-4,-4],k:0,r:0,f:"Faturamento não é lucro nem caixa. Sem custos e despesas, a rentabilidade continua invisível."}]},
{a:"Padronização do atendimento",c:"Processos internos e perspectiva de clientes",q:"Cada atendente responde de um jeito, algumas solicitações se perdem e clientes reclamam. O caixa permite uma única medida este mês. Qual você adota?",o:[
